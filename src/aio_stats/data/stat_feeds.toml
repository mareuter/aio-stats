[locations]

[locations.office]
feeds = [
    "temperature",
    "relative-humidity",
    "battery-percent",
    "battery-voltage"
]
# Time between points in minutes
delay = 5

[locations.northwest-bedroom]
feeds = [
    "temperature",
    "relative-humidity",
    "battery-percent",
    "battery-voltage"
]
# Time between points in minutes
delay = 5

[locations.living-room]
feeds = [
    "autolux",
    "ls-battery-percent",
    "ls-battery-voltage"
]
# Time between points in minutes
delay = 5
# Bounds required
[locations.living-room.bounds]
autolux = "lamptimer"

[locations.main-bedroom]
feeds = [
    "temperature",
    "relative-humidity",
    "battery-percent",
    "battery-voltage"
]
# Time between points in minutes
delay = 5

[locations.family-room]
feeds = [
    "temperature",
    "relative-humidity",
    "battery-percent",
    "battery-voltage"
]
# Time between points in minutes
delay = 5

[plotting]
temperature = ["stats_trend", "min_max_scatter"]
relative-humidity = ["stats_trend", "min_max_scatter"]
autolux = ["stats_trend"]
battery-voltage = []
battery-percent = []
ls-battery-voltage = []
ls-battery-percent = []

[shorts]
temperature = "Temp"
relative-humidity = "RH"
autolux = "Lux"
